
name: NodeJs Build

on:
  push:
    branches: ["main"]
    paths:
      - 'react-proj1/**'
      - '.github/workflows/reactjs-build.yml'

  workflow_dispatch:

env:
  workingdir: ./react-proj1

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3

      - name: install nodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
         npm install
        working-directory: ${{ env.workingdir }}
      
      - name: run tests
        run: npm test
        working-directory: ${{ env.workingdir }}
        
