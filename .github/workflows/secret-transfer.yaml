name: "Secret transfer from linux runner to macos runner"
on:
  workflow_dispatch:


jobs:

  fetch-secrets:
    permissions:
     id-token: write
    runs-on: self-hosted
    outputs:
      secret_bundle: ${{ steps.packer.outputs.bundle }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch and Pack Secrets
        id: packer
        shell: bash
        run: |
          # We use a Heredoc (<< 'EOF') to keep the Python script clean
          JSON_DATA=$(python3 - << 'EOF'
          import os, subprocess, json

          # Access variables by the NAMES defined in the 'env:' block below
          secret_string = os.environ.get('MY_SECRETS', '')
          kv_name = os.environ.get('VAULT_NAME', '')

          secrets = [s.strip() for s in secret_string.split(',') if s.strip()]
          results = {}

          for s in secrets:
              # Run the Azure CLI command
              val = subprocess.getoutput(f"az keyvault secret show --vault-name '{kv_name}' --name '{s}' --query value -o tsv")
              results[s] = val

          print(json.dumps(results))
          EOF
          )
          
          # Double Base64 encode (use -w 0 to avoid line breaks on Linux)
          ENCODED_BUNDLE=$(echo -n "$JSON_DATA" | base64 -w 0 | base64 -w 0)
          echo "bundle=$ENCODED_BUNDLE" >> $GITHUB_OUTPUT
        env:
          # THIS IS THE MAPPING STEP:
          MY_SECRETS: "test1,test2"        # e.g., "test1,test2"
          VAULT_NAME: "ci-kv-15479" # e.g., "ci-kv-15479"

  build-ios:
    needs: fetch-secrets
    runs-on: macos-latest
    steps:
      - name: Unpack and Mask Secrets
        shell: bash
        env:
          # Pass the output into an env var first
          RAW_BUNDLE: ${{ needs.fetch-secrets.outputs.secret_bundle }}
        run: |
          # 1. Decode twice (macOS base64 supports -d)
          DECODED_JSON=$(echo -n "$RAW_BUNDLE" | base64 -d | base64 -d)
          
          # 2. Export to a local env var so Python can read it safely
          export DECODED_JSON
          
          # 3. Use a Heredoc (<< 'EOF') to pass the script to Python
          python3 - << 'EOF'
          import json, os
          # Read from environment variable to avoid shell quote issues
          data = json.loads(os.environ['DECODED_JSON'])
          
          for key, value in data.items():
              # Register the mask with the runner
              print(f"::add-mask::{value}")
              # Write to the environment file
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"{key}={value}\n")
          EOF

      - name: Debug Secret Handoff
        shell: bash
        run: |
          echo "--- Secret Verification ---"
          
          # 1. Check if the variables are set (will print 'Set' or 'Empty')
          [ -z "$test1" ] && echo "test1: EMPTY" || echo "test1: FOUND"
          [ -z "$test2" ] && echo "test2: EMPTY" || echo "test2: FOUND"

          # 2. Print the length of the secrets (safe way to verify data)
          echo "Length of test1: ${#test1} characters"
          echo "Length of test2: ${#test2} characters"

          # 3. TRICK: Echo with spaces (Bypasses GitHub's *** masking)
          # DO NOT keep this in production. Use only for temporary debugging.
          echo -n "test1 (spaced): "
          echo "$test1" | sed 's/./& /g'
          
          echo -n "test2 (spaced): "
          echo "$test2" | sed 's/./& /g'