name: "Secret transfer from linux runner to macos runner"
on:
  workflow_dispatch:


jobs:

  fetch-secrets:
    permissions:
     id-token: write
    runs-on: self-hosted
    outputs:
      secret_bundle: ${{ steps.packer.outputs.bundle }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch and Pack Secrets
        id: packer
        shell: bash
        run: |
          # Build JSON object safely using Python
          JSON_DATA=$(python3 -c "
          import os, subprocess, json
          secrets = os.environ['test1,test2'].split(',')
          kv_name = os.environ['ci-kv-15479']
          results = {s.strip(): subprocess.getoutput(f'az keyvault secret show --vault-name {kv_name} --name {s.strip()} --query value -o tsv') for s in secrets}
          print(json.dumps(results))
          ")
          
          # Double Base64 encode (use -w 0 on Linux to prevent line wraps)
          ENCODED_BUNDLE=$(echo -n "$JSON_DATA" | base64 -w 0 | base64 -w 0)
          echo "bundle=$ENCODED_BUNDLE" >> $GITHUB_OUTPUT

  build-ios:
    needs: fetch-secrets
    runs-on: macos-latest
    steps:
      - name: Unpack and Mask Secrets
        shell: bash
        env:
          # Pass the output into an env var first
          RAW_BUNDLE: ${{ needs.fetch-secrets.outputs.secret_bundle }}
        run: |
          # 1. Decode twice (macOS base64 supports -d)
          DECODED_JSON=$(echo -n "$RAW_BUNDLE" | base64 -d | base64 -d)
          
          # 2. Export to a local env var so Python can read it safely
          export DECODED_JSON
          
          # 3. Use a Heredoc (<< 'EOF') to pass the script to Python
          python3 - << 'EOF'
          import json, os
          # Read from environment variable to avoid shell quote issues
          data = json.loads(os.environ['DECODED_JSON'])
          
          for key, value in data.items():
              # Register the mask with the runner
              print(f"::add-mask::{value}")
              # Write to the environment file
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"{key}={value}\n")
          EOF

      - name: Build App
        run: |
          # Secrets are now available and masked
          echo "Building with secret: $MY_SECRET_NAME"
          ./scripts/build-ios.sh