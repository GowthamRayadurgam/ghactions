name: "Secret transfer from linux runner to macos runner"
on:
  workflow_dispatch:


jobs:
  fetch-secrets:
    runs-on: self-hosted
    outputs:
      secret_bundle: ${{ steps.packer.outputs.bundle }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
         
      - name: Fetch and Pack Secrets
        id: packer
        run: |
          IFS=',' read -ra SECRET_LIST <<< 'test1,test2'
          
          # Initialize a JSON-like string
          JSON_DATA="{"
          
          for SECRET in "${SECRET_LIST[@]}"; do
            VALUE=$(az keyvault secret show \
              --vault-name "ci-kv-15478" \
              --name "$SECRET" \
              --query value -o tsv)
            
            echo "::add-mask::$VALUE"
            
            # Add to the JSON string (escaping quotes if necessary)
            JSON_DATA+="\"$SECRET\":\"$VALUE\","
          done
          
          # Remove trailing comma and close JSON
          JSON_DATA="${JSON_DATA%,}}"
          
          # Double Base64 encode to bypass GitHub's output redactor
          ENCODED_BUNDLE=$(echo -n "$JSON_DATA" | base64 | base64)
          echo "bundle=$ENCODED_BUNDLE" >> $GITHUB_OUTPUT

  build-ios:
    needs: fetch-secrets
    runs-on: macos-latest
    steps:
      - name: Unpack and Mask Secrets
        run: |

         ENCODED="${{ needs.fetch-secrets.outputs.secret_bundle }}"
         DECODED=$(echo "$ENCODED" | base64 -d | base64 -d)        
         echo "$DECODED" | python3 -c "
         import json, sys
         data = json.load(sys.stdin)
         for key, value in data.items():
            print(f'::add-mask::{value}')
            with open(sys.argv[1], 'a') as f:
                f.write(f'{key}={value}\n')
         " "$GITHUB_ENV

      - name: Verify (Masked)
        run: |
         echo "Building with API_KEY: $MY_SECRET_NAME"