name: Deploy app
on:
  workflow_run:
    workflows: [React-Artifact-output-cache]
    types: [completed]


jobs:
    on-success:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        permissions:
         actions: read
         contents: read
         
        steps:
            - name: download artifact
              uses: actions/download-artifact@v5
              with:
                name: build-artifacts
                run-id: ${{ github.event.workflow_run.id }}
                path: dist/
                
            - name: list the artifact files
              run: ls -lrt

              
